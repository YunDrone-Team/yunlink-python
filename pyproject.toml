[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "yunlink-python"
version = "1.1.0"
description = "Simple Sunray vehicle control through YunLink"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "YunDrone Team"}]
dependencies = ["yunlink>=2.0.1"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Repository = "https://github.com/YunDrone-Team/yunlink-python"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.12", "build>=1.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/yunlink_python"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
